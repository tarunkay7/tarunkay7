<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-label="Tarun: data pipelines and AI that make messy data usable">
<defs>
<pattern id="dim" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1.5" fill="#33406A"/></pattern>
<pattern id="teal" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="4.2" fill="#3DD6C6"/></pattern>
<pattern id="amber" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="3" fill="#FF9F43"/></pattern>
<linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="left" x1="0" x2="1"><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".75" stop-color="#fff"/></linearGradient>
<mask id="mLeft"><rect width="1000" height="330" fill="url(#left)"/></mask>
<mask id="mTeal"><g transform="rotate(18 500 165)"><rect x="-500" y="-400" width="480" height="1100" fill="url(#band)"><animateTransform attributeName="transform" type="translate" from="0 0" to="1900 0" dur="14s" repeatCount="indefinite"/></rect></g></mask>
<mask id="mAmber"><g transform="rotate(-24 500 165)"><rect x="-500" y="-400" width="300" height="1100" fill="url(#band)"><animateTransform attributeName="transform" type="translate" from="0 0" to="1900 0" dur="21s" begin="-9s" repeatCount="indefinite"/></rect></g></mask>
</defs>
<rect width="1000" height="330" rx="18" fill="#101A33"/>
<g mask="url(#mLeft)">
<rect width="1000" height="330" fill="url(#dim)"/>
<rect width="1000" height="330" fill="url(#teal)" mask="url(#mTeal)"/>
<rect width="1000" height="330" fill="url(#amber)" mask="url(#mAmber)"/>
</g>
<text x="48" y="150" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3" fill="#E8ECF8">Tarun</text>
<text x="52" y="196" font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="21" fill="#8A96B8">Data engineering and applied AI.</text>
</svg>
